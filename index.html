<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>災害ニュースPWA</title>
  </head>
  <body>
    <main>
      <h1>災害ニュース</h1>

      <label for="api-type">API種別</label>
      <select id="api-type">
        <option value="/api/emergency">Emergency</option>
        <option value="/api/important">Important</option>
        <option value="/api/articles" selected>Articles</option>
        <option value="/api/static-info">Static Info</option>
      </select>

      <label for="strategy">キャッシュ戦略</label>
      <select id="strategy">
        <option value="cache-first">Cache First</option>
        <option value="network-first">Network First</option>
        <option value="freshness-aware">Freshness Aware</option>
      </select>

      <label for="condition">通信条件</label>
      <select id="condition">
        <option value="normal">normal</option>
        <option value="mild">mild</option>
        <option value="severe">severe</option>
        <option value="unstable">unstable</option>
      </select>

      <label for="seed">シード</label>
      <input id="seed" type="number" step="1" min="0" />
      <label for="trial-id">試行番号</label>
      <input id="trial-id" type="number" step="1" min="0" />
      <button id="fetch-news" type="button">ニュースを取得</button>
      <div>
        <label for="cache-state">初期キャッシュ状態</label>
        <select id="cache-state">
          <option value="cold">Cold</option>
          <option value="fresh">Fresh</option>
          <option value="expired">Expired</option>
        </select>
        <button id="prepare-cache" type="button">キャッシュを初期化</button>
        <span id="cache-status" role="status"></span>
      </div>
      <button id="export-csv" type="button">実験ログをCSVで保存</button>
      <span id="export-status" role="status"></span>

      <h2>ニュース一覧</h2>
      <div id="news-list"></div>
      <div id="article-detail"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
